# Configuração do slf4j-simple (saída no console)
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# Deixe em debug para ver linha a linha o que o Apache POI está lendo
org.slf4j.simpleLogger.log.org.example.leitura=info
# Silencia logs internos do POI
org.slf4j.simpleLogger.log.org.apache.poi=warn
